<script>window.YSSPOTID="KT-103";</script>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script src="calendar.js?v=20260817j"></script>
<script src="shared.js?v=20260817k"></script>
<script>
(function(){
  var Y=window.YS, esc=Y.esc;
  // 静的に生成した spot/<ID>.html は window.YSSPOTID でIDを渡してくる。
  // 旧来の spot.html?id=… のリンクも引き続き動くようにしておく。
  var isStatic=!!window.YSSPOTID;
  var id=window.YSSPOTID||(new URLSearchParams(location.search)).get("id");
  var box=document.getElementById("spot");
  function missing(){box.innerHTML='<div class="detail-body spot-empty"><h1>拠点が見つかりませんでした</h1><p>URLをご確認いただくか、一覧からおさがしください。</p></div>';}
  function setMeta(r){
    document.title=r.name+"｜いばしょ・きっかけ MAP";
    var description=(r.intro||r.summary||"").slice(0,120);
    var md=document.querySelector('meta[name="description"]');if(md)md.content=description;
    var ot=document.querySelector('meta[property="og:title"]');if(ot)ot.content=document.title;
    var od=document.querySelector('meta[property="og:description"]');if(od)od.content=description;
    var oi=document.querySelector('meta[property="og:image"]');if(oi&&r.image)oi.content=r.image;
    // 静的ページ側は正しい canonical を焼き込み済み。?id= で来たときだけ、
    // 検索エンジンの評価が静的ページに集まるよう向き先を書き換える。
    if(!isStatic){var canonical=document.querySelector('link[rel="canonical"]');if(canonical)canonical.href=Y.spotUrl(r.id);}
    var schema=document.getElementById("spotStructuredData");
    if(!schema){schema=document.createElement("script");schema.id="spotStructuredData";schema.type="application/ld+json";document.head.appendChild(schema);}
    var structured={"@context":"https://schema.org","@type":r.address?"Place":"Organization",name:r.name,description:description,url:location.href};
    if(r.image)structured.image=r.image;
    if(r.address)structured.address={"@type":"PostalAddress",streetAddress:r.address,addressRegion:r.pref,addressLocality:r.city,addressCountry:"JP"};
    if(r.lat!=null)structured.geo={"@type":"GeoCoordinates",latitude:r.lat,longitude:r.lng};
    if(r.url)structured.sameAs=r.url;
    schema.textContent=JSON.stringify(structured);
  }
  function audiencePillsHtml(r){
    var labels={junior:"中学生",high:"高校生",other:"その他"};
    var detail=(r.targets||[]).join("・")||"対象を公式サイトで確認";
    return '<span class="audience-pills" aria-label="'+esc("対象："+detail)+'" title="'+esc("対象："+detail)+'">'+Y.audienceKinds(r).map(function(kind){return '<span class="pill audience-pill audience-'+kind+'">'+labels[kind]+'</span>';}).join("")+'</span>';
  }
  function render(r){
    setMeta(r);
    var cv=Y.coverOf(r);
    var place=[r.region,r.pref,r.city].filter(function(x,i,a){return x&&a.indexOf(x)===i;}).join(" · ");
    var heroSrc=r.image||Y.getPhotoUrl(cv);
    var hero='<img id="spotPhoto" src="'+esc(heroSrc)+'" alt="'+esc(Y.photoAlt(r,cv))+'" fetchpriority="high" decoding="async" referrerpolicy="no-referrer">';
    var h='<div class="spot-hero">'+hero+'<div class="spot-hero-pills"><span class="pill">'+esc(r.region==="全国オンライン"?"オンライン":r.region)+'</span>'+audiencePillsHtml(r)+'</div><span id="spotPhotoCredit" class="photo-credit '+(Y.hasOfficialPhoto(r)?'is-official':'is-image')+'">'+Y.photoCredit(r)+'</span></div>';
    h+='<div class="detail-body spot-detail-body">';
    if(r.logo) h+='<img class="detail-logo" src="'+esc(r.logo)+'" alt="'+esc(r.name)+'のロゴ" onerror="this.remove()">';
    h+='<h1>'+esc(r.name)+'</h1>';
    h+='<div class="detail-place">'+Y.SVG_PIN+'<span>'+esc(place)+'</span></div>';
    h+='<p class="detail-intro">'+esc(r.intro)+'</p>';
    if(r.summary) h+='<section class="detail-sec detail-summary"><h2>この拠点について</h2><p>'+esc(r.summary)+'</p></section>';
    if(Y.hasOfficialPhoto(r)) h+='<p class="photo-source-note" id="spotPhotoSource">写真候補：<a href="'+esc(r.imageSourceUrl)+'" target="_blank" rel="noopener">団体公式サイト</a><span>公開前に利用条件を確認してください</span></p>';
    else h+='<p class="photo-source-note" id="spotPhotoSource">写真：活動分野を表す生成イメージ</p>';
    if(r.fieldTags&&r.fieldTags.length) h+='<section class="detail-sec"><h2>やってみたいこと</h2><div class="detail-tags">'+r.fieldTags.map(function(t){return '<span class="tag">'+esc(t)+'</span>';}).join('')+'</div></section>';
    if(r.useTags&&r.useTags.length) h+='<section class="detail-sec"><h2>利用のしかた</h2><div class="detail-tags">'+r.useTags.map(function(t){return '<span class="tag use">'+esc(t)+'</span>';}).join('')+'</div></section>';
    var info='';
    if(r.targets&&r.targets.length) info+='<div><b>対象</b>'+esc(r.targets.join("・"))+'</div>';
    if(r.station) info+='<div><b>アクセス</b>'+esc(r.station)+'</div>';
    if(r.address) info+='<div><b>住所</b>'+esc(r.address)+'</div>';
    if(info) h+='<section class="detail-sec"><h2>基本情報</h2><div class="detail-info">'+info+'</div></section>';
    if(r.infoUrl||r.url){
      h+='<section class="detail-sec detail-sources"><h2>この情報の出どころ</h2><div class="source-links">';
      if(r.infoUrl) h+='<a href="'+esc(r.infoUrl)+'" target="_blank" rel="noopener">'+Y.SVG_EXT+'掲載内容の参照元</a>';
      if(r.url&&r.url!==r.infoUrl) h+='<a href="'+esc(r.url)+'" target="_blank" rel="noopener">'+Y.SVG_EXT+'団体・施設の公式サイト</a>';
      h+='</div></section>';
    }
    if(r.lat!=null) h+='<section class="detail-sec"><h2>地図</h2><div id="detailMap"></div></section>';
    h+='<div class="detail-actions">';
    if(r.url) h+='<a class="da-primary" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+Y.SVG_EXT+'公式サイト</a>';
    if(r.address) h+='<a class="da-ghost" href="'+esc(Y.mapUrl(r))+'" target="_blank" rel="noopener">'+Y.SVG_MAP+'地図で開く</a>';
    h+='<button class="da-ghost detail-favorite" data-favorite-id="'+esc(r.id)+'">'+window.YSFavorites.SVG_HEART+'<span data-favorite-label>気になる</span></button>';
    h+='<button class="da-ghost detail-calendar" data-calendar-id="'+esc(r.id)+'">'+window.YSCalendar.SVG_CALENDAR+'<span>予定に入れる</span></button>';
    h+='<button class="da-ghost" id="shareBtn">シェア</button></div>';
    var rel=Y.DATA.filter(function(x){return x.region===r.region&&x.id!==r.id&&Y.DEFAULT_STATUS[x.status];}).slice(0,6);
    h+='</div>';
    if(rel.length) h+='<div class="detail-related"><h2>'+esc(r.region)+'のほかの拠点</h2><div class="grid" id="relGrid"></div></div>';
    box.innerHTML=h;
    if(window.YSFavorites)window.YSFavorites.syncAll(box);
    if(window.YSCalendar)window.YSCalendar.register([r]);

    var spotPhoto=document.getElementById("spotPhoto");
    spotPhoto.onerror=function(){
      var fallback=Y.getPhotoUrl(cv);
      if(!this.dataset.fallback&&this.src.indexOf(fallback)===-1){
        this.dataset.fallback="1";this.src=fallback;this.alt=Y.photoAlt({},cv);this.removeAttribute("referrerpolicy");
        var badge=document.getElementById("spotPhotoCredit");badge.textContent="イメージ写真";badge.className="photo-credit is-image";
        document.getElementById("spotPhotoSource").textContent="写真：活動分野を表す生成イメージ";
      }else this.style.display="none";
    };
    if(rel.length){var rgd=document.getElementById("relGrid");rel.forEach(function(x){rgd.appendChild(Y.card(x));});}
    if(r.lat!=null&&window.L){
      var m=L.map("detailMap",{scrollWheelZoom:false,attributionControl:false}).setView([r.lat,r.lng],14);
      L.tileLayer("https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png",{maxZoom:19,subdomains:"abcd"}).addTo(m);
      L.marker([r.lat,r.lng],{icon:Y.markerIcon(cv)}).addTo(m);setTimeout(function(){m.invalidateSize();},80);
    }else if(r.lat!=null) document.getElementById("detailMap").innerHTML='<p class="map-empty">地図を読み込めませんでした。「地図で開く」からご確認ください。</p>';
    var sb=document.getElementById("shareBtn");
    if(sb) sb.onclick=function(){
      var url=location.href;
      if(navigator.share){navigator.share({title:r.name,url:url}).catch(function(){});}
      else{navigator.clipboard&&navigator.clipboard.writeText(url);var t=document.getElementById("toast");t.textContent="リンクをコピーしました";t.classList.add("show");setTimeout(function(){t.classList.remove("show");},1800);}
    };
  }
  if(!id){missing();return;}
  box.innerHTML='<div class="detail-body spot-loading" role="status">詳細情報を読み込んでいます…</div>';
  fetch("data-details/"+encodeURIComponent(id)+".json")
    .then(function(response){if(!response.ok)throw new Error("not found");return response.json();})
    .then(render)
    .catch(function(){var fallback=Y.BYID[id];if(fallback)render(fallback);else missing();});
})();
</script>
</body>
