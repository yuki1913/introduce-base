<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!--
  SNS共有カード（og:image）のひな形。scripts/make-og.mjs から読み込んで
  1200x630 で書き出す。__COUNT__ と __FONT*__ はスクリプトが差し替える。
-->
<link rel="stylesheet" href="../tokens.css">
<style>
  @font-face{font-family:"Noto Sans JP";font-weight:400;font-style:normal;font-display:block;
    src:url("__FONT400__") format("woff2");}
  @font-face{font-family:"Noto Sans JP";font-weight:700;font-style:normal;font-display:block;
    src:url("__FONT700__") format("woff2");}
  @font-face{font-family:"Noto Sans JP";font-weight:900;font-style:normal;font-display:block;
    src:url("__FONT900__") format("woff2");}

  *{box-sizing:border-box;margin:0}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{
    font-family:"Noto Sans JP",sans-serif;
    background:var(--band-ink);
    color:var(--color-accent-ink);
    position:relative;
  }
  .photo{
    position:absolute;inset:0 0 0 auto;width:640px;height:630px;
    background:url("../img/editorial/hero-home.jpg") center/cover no-repeat;
  }
  /* 写真から濃色パネルへ、左に向かって溶かす。文字は必ず濃色側に乗せる。 */
  .scrim{
    position:absolute;inset:0;
    background:linear-gradient(100deg,
      var(--band-ink) 0%, var(--band-ink) 48%,
      color-mix(in oklab, var(--band-ink) 82%, transparent) 60%,
      color-mix(in oklab, var(--band-ink) 20%, transparent) 78%,
      transparent 100%);
  }
  .inner{position:absolute;inset:0;padding:64px 68px;display:flex;flex-direction:column;justify-content:space-between}

  .brand{display:flex;align-items:center;gap:14px;font-weight:700;font-size:26px;letter-spacing:.01em}
  .pin{
    width:30px;height:30px;border-radius:50%;background:var(--color-accent);
    display:grid;place-items:center;flex:none;
  }
  .pin::after{content:"";width:11px;height:11px;border-radius:50%;background:var(--color-paper)}

  h1{font-weight:900;font-size:66px;line-height:1.34;letter-spacing:.005em;max-width:660px}
  /* マーカーは x-height に引く（design.md の指定どおり、ベースラインには置かない） */
  /* 疑似要素を z-index:-1 で敷くと body の背景の裏に回って消える。
     背景グラデーションで帯を描けば、文字の下に確実に入る。 */
  .hl{
    display:inline-block;padding-inline:.12em;color:var(--color-ink);
    background-image:linear-gradient(180deg,transparent 14%, var(--marker) 14%, var(--marker) 92%, transparent 92%);
  }
  .lead{margin-top:24px;font-weight:500;font-size:25px;line-height:1.7;color:var(--color-accent-ink);opacity:.9;max-width:660px}

  .foot{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .chip{
    font-weight:700;font-size:23px;padding:11px 22px;border-radius:999px;
    background:color-mix(in oklab, var(--color-accent-ink) 14%, transparent);
    color:var(--color-accent-ink);
  }
  .chip.is-count{background:var(--color-accent);color:var(--color-on-accent)}
  .chip.is-count b{font-size:27px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="scrim"></div>
  <div class="inner">
    <div class="brand"><span class="pin"></span>いばしょ・きっかけ MAP</div>

    <div>
      <h1>「やってみたい」に、<br><span class="hl">出会える</span>場所。</h1>
      <p class="lead">中学生・高校生のための、全国の居場所・プログラム</p>
    </div>

    <div class="foot">
      <span class="chip is-count">全国 <b>__COUNT__</b> 拠点</span>
      <span class="chip">探究・居場所・起業・自然体験</span>
    </div>
  </div>
</body>
</html>
